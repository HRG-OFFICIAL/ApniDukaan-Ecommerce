version: '3.8'

services:
  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:4000/graphql
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api-gateway
    networks:
      - ApniDukaan-network

  # API Gateway
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - CATALOG_SERVICE_URL=http://catalog-service:4001
      - USER_SERVICE_URL=http://user-service:4002
      - ORDER_SERVICE_URL=http://order-service:4003
      - PAYMENT_SERVICE_URL=http://payment-service:4004
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    volumes:
      - ./backend/api-gateway:/app
      - /app/node_modules
    depends_on:
      - catalog-service
      - user-service
      - order-service
      - payment-service
      - redis
    networks:
      - ApniDukaan-network

  # User Service
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=development
      - PORT=4002
      - MONGODB_URI=mongodb://mongodb:27017/ApniDukaan_users
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=http://localhost:3000/api/auth/callback/google
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - FROM_EMAIL=noreply@ApniDukaan.com
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/user-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - ApniDukaan-network

  # Catalog Service
  catalog-service:
    build:
      context: ./backend/catalog-service
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - PORT=4001
      - MONGODB_URI=mongodb://mongodb:27017/ApniDukaan_catalog
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - S3_BUCKET=${S3_BUCKET}
      - CLOUDFRONT_DOMAIN=${CLOUDFRONT_DOMAIN}
      # For local development with MinIO
      - S3_ENDPOINT=http://minio:9000
      - S3_FORCE_PATH_STYLE=true
    volumes:
      - ./backend/catalog-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
      - kafka
      - minio
    networks:
      - ApniDukaan-network

  # Order Service
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    ports:
      - "4003:4003"
    environment:
      - NODE_ENV=development
      - PORT=4003
      - MONGODB_URI=mongodb://mongodb:27017/ApniDukaan_orders
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_CLIENT_ID=order-service
      - KAFKA_GROUP_ID=order-service-group
      - USER_SERVICE_URL=http://user-service:4002
      - CATALOG_SERVICE_URL=http://catalog-service:4001
      - PAYMENT_SERVICE_URL=http://payment-service:4004
    volumes:
      - ./backend/order-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
      - kafka
    networks:
      - ApniDukaan-network

  # Payment Service
  payment-service:
    build:
      context: ./backend/payment-service
      dockerfile: Dockerfile
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=development
      - PORT=4004
      - MONGODB_URI=mongodb://mongodb:27017/ApniDukaan_payments
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET}
      - PAYPAL_MODE=sandbox
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
    volumes:
      - ./backend/payment-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - ApniDukaan-network

  # Cart Service
  cart-service:
    build:
      context: ./backend/cart-service
      dockerfile: Dockerfile
    ports:
      - "4005:4005"
    environment:
      - NODE_ENV=development
      - PORT=4005
      - MONGODB_URI=mongodb://mongodb:27017/ApniDukaan_cart
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/cart-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - redis
    networks:
      - ApniDukaan-network

  # Search Service
  search-service:
    build:
      context: ./backend/search-service
      dockerfile: Dockerfile
    ports:
      - "4006:4006"
    environment:
      - NODE_ENV=development
      - PORT=4006
      - MONGODB_URI=mongodb://mongodb:27017/ApniDukaan_search
    volumes:
      - ./backend/search-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - ApniDukaan-network

  # Notification Service
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    ports:
      - "4007:4007"
    environment:
      - NODE_ENV=development
      - PORT=4007
      - MONGODB_URI=mongodb://mongodb:27017/ApniDukaan_notifications
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - FRONTEND_URL=http://localhost:3000
    volumes:
      - ./backend/notification-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - ApniDukaan-network

  # Order Management Service
  order-management-service:
    build:
      context: ./backend/order-management-service
      dockerfile: Dockerfile
    ports:
      - "4008:4008"
    environment:
      - NODE_ENV=development
      - PORT=4008
      - MONGODB_URI=mongodb://mongodb:27017/ApniDukaan_order_management
      - USER_SERVICE_URL=http://user-service:4002
      - CATALOG_SERVICE_URL=http://catalog-service:4001
      - PAYMENT_SERVICE_URL=http://payment-service:4004
      - NOTIFICATION_SERVICE_URL=http://notification-service:4007
    volumes:
      - ./backend/order-management-service:/app
      - /app/node_modules
    depends_on:
      - mongodb
      - user-service
      - catalog-service
      - payment-service
      - notification-service
    networks:
      - ApniDukaan-network

  # MongoDB
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=ApniDukaan
    volumes:
      - mongodb_data:/data/db
      - ./infrastructure/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - ApniDukaan-network

  # Redis
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    networks:
      - ApniDukaan-network


  # MinIO (S3 Compatible Storage for local development)
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ApniDukaan-network


  # Nginx (Load Balancer & Reverse Proxy)
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api-gateway
    networks:
      - ApniDukaan-network


volumes:
  mongodb_data:
  redis_data:
  minio_data:

networks:
  ApniDukaan-network:
    driver: bridge
