services:
  # API Gateway (Backend)
  - type: web
    name: apnidukaan-api-gateway
    env: node
    plan: free
    buildCommand: cd backend/api-gateway && npm install && npm run build
    startCommand: cd backend/api-gateway && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        fromDatabase:
          name: mongodb-atlas
          property: connectionString
      - key: REDIS_URL
        fromDatabase:
          name: redis-cloud
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://apnidukaan-ecommerce.vercel.app

databases:
  - name: mongodb-atlas
    plan: free
  - name: redis-cloud
    plan: free
