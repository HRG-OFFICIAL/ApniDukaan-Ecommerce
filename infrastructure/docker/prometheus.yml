global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Nginx Exporter
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # MongoDB Exporter
  - job_name: 'mongodb-exporter'
    static_configs:
      - targets: ['mongodb-exporter:9216']

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ApniDukaan Services
  - job_name: 'apnidukaan-api-gateway'
    static_configs:
      - targets: ['api-gateway:4000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'apnidukaan-catalog-service'
    static_configs:
      - targets: ['catalog-service:4001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'apnidukaan-user-service'
    static_configs:
      - targets: ['user-service:4002']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'apnidukaan-order-service'
    static_configs:
      - targets: ['order-service:4003']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'apnidukaan-payment-service'
    static_configs:
      - targets: ['payment-service:4004']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'apnidukaan-cart-service'
    static_configs:
      - targets: ['cart-service:4005']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'apnidukaan-search-service'
    static_configs:
      - targets: ['search-service:4006']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'apnidukaan-notification-service'
    static_configs:
      - targets: ['notification-service:4007']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'apnidukaan-frontend'
    static_configs:
      - targets: ['frontend:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s
