apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ApniDukaan-ingress
  namespace: ApniDukaan
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  tls:
  - hosts:
    - ApniDukaan.com
    - www.ApniDukaan.com
    - api.ApniDukaan.com
    secretName: ApniDukaan-tls
  rules:
  - host: ApniDukaan.com
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  - host: www.ApniDukaan.com
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
  - host: api.ApniDukaan.com
    http:
      paths:
      - path: /(.*)
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 4000
